name: Build kernels

on:
  push:
    branches:
      - feature/resukisu-susfs-rekernel-nomount-bbg
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.device }} (${{ matrix.defconfig }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: dipper
            defconfig: dipper_user_defconfig
            dtb: dipper-mp-v2.1.dtb
          - device: polaris
            defconfig: polaris_user_defconfig
            dtb: polaris-mp-v2.1.dtb
          - device: beryllium
            defconfig: beryllium_user_defconfig
            dtb: beryllium-mp-v2.1.dtb
          - device: equuleus
            defconfig: equuleus_user_defconfig
            dtb: equuleus-mp-v2.1.dtb
          - device: perseus
            defconfig: perseus_user_defconfig
            dtb: perseus-mp-v2.1.dtb
          - device: ursa
            defconfig: ursa_user_defconfig
            dtb: ursa-mp-v2.1.dtb

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libncurses-dev
          git clone --depth=1 https://github.com/kdrag0n/proton-clang /opt/proton-clang

      - name: Build
        run: |
          export PATH=/opt/proton-clang/bin:$PATH
          make O=out/${{ matrix.device }} ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- ${{ matrix.defconfig }}
          make O=out/${{ matrix.device }} ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)
          # Build Image.gz-dtb via kernel build system (requires CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y)
          make O=out/${{ matrix.device }} ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- Image.gz-dtb

      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/${{ matrix.device }}/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          cd AnyKernel3
          sed -i "s/device.name1=.*/device.name1=${{ matrix.device }}/" anykernel.sh
          sed -i "s/device.name2=.*/device.name2=${{ matrix.device }}${{ matrix.device == 'ursa' && '-mi8937' || '' }}/" anykernel.sh
          zip -r9 ../${{ matrix.device }}-kernel.zip . -x ".git/*" "README.md" "*.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-kernel-zip
          path: ${{ matrix.device }}-kernel.zip

  release:
    name: Create Release
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kernel Release ${{ github.ref_name }}
          body: |
            Kernel build for Xiaomi SDM660 devices (dipper, polaris, beryllium, equuleus, perseus, ursa)
            Built with ReSukiSU + SUSFS + Re:Kernel + NoMount + Baseband-guard
          files: |
            artifacts/dipper-kernel-zip/dipper-kernel.zip
            artifacts/polaris-kernel-zip/polaris-kernel.zip
            artifacts/beryllium-kernel-zip/beryllium-kernel.zip
            artifacts/equuleus-kernel-zip/equuleus-kernel.zip
            artifacts/perseus-kernel-zip/perseus-kernel.zip
            artifacts/ursa-kernel-zip/ursa-kernel.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}